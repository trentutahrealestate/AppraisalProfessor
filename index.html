document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

;background:#C8A24A;display:flex;align-items:center;justify-content:center;color:#1a1814;font-family:'Cormorant Garamond',serif;font-weight:700;font-size:18px;\">AP<\u002Fspan>\n        <span style=\"font-family:'IBM Plex Mono',monospace;font-size:13px;font-weight:600;letter-spacing:1px;color:#f3eee2;text-transform:uppercase;\">The Appraisal Professor<\u002Fspan>\n      <\u002Fa>\n      <a href=\"#look\" class=\"dz-focus\" style=\"display:inline-flex;align-items:center;gap:8px;background:#E3C677;color:#1a1814;font-size:15px;font-weight:700;padding:11px 20px;border-radius:8px;text-decoration:none;\">Free home-value look<\u002Fa>\n    <\u002Fdiv>\n  <\u002Fnav>\n\n  <div id=\"top\"><\u002Fdiv>\n\n  <!-- 1 · HERO -->\n  <section class=\"dz-wrap\" style=\"max-width:1180px;margin:0 auto;padding:70px 40px 78px;\">\n    <div class=\"dz-split\" style=\"display:grid;grid-template-columns:1.05fr 0.95fr;gap:56px;align-items:center;\">\n      <div style=\"animation:apRise .6s ease both;\">\n        <div style=\"display:inline-flex;align-items:center;gap:8px;font-family:'IBM Plex Mono',monospace;font-size:12px;font-weight:500;letter-spacing:1.5px;text-transform:uppercase;color:#9a7d2e;background:#f0e7cf;border:1px solid #e3d4a6;padding:7px 13px;border-radius:6px;margin-bottom:26px;\">● For Utah County downsizers<\u002Fdiv>\n        <h1 class=\"dz-display\" style=\"font-family:'Cormorant Garamond',serif;font-weight:600;font-size:58px;line-height:1.04;letter-spacing:-0.5px;color:#1a1814;\">When you're downsizing, the price isn't part of the decision. <em style=\"font-style:italic;color:#9a7d2e;\">It's the whole decision.<\u002Fem><\u002Fh1>\n        <p style=\"font-size:19px;line-height:1.62;color:#544f44;max-width:520px;margin-top:24px;\">Andrew is a licensed appraiser <strong style=\"color: rgb(26, 24, 20);\">and<\u002Fstrong> a real estate agent, the best person in Utah County to price your home like an appraiser and sell it like an agent. 23 years of getting the number right.<\u002Fp>\n        <div style=\"margin-top:34px;\">\n          <a href=\"#look\" class=\"dz-focus\" style=\"display:inline-flex;align-items:center;gap:10px;background:#1a1814;color:#faf7f1;font-size:17px;font-weight:600;padding:17px 30px;border-radius:8px;text-decoration:none;\">See how the free home-value look works →<\u002Fa>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <!-- hero video placeholder — drop a YouTube <iframe> in place of this block -->\n      <div style=\"animation:apRise .8s ease both;\">\n        <div data-video-slot=\"hero\" style=\"position:relative;aspect-ratio:16/9;background:#1a1814;border-radius:14px;overflow:hidden;border:1px solid #2a2620;display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:0 24px 50px -20px rgba(60,48,20,.3);\">\n          <div style=\"width:64px;height:64px;border-radius:50%;background:rgba(227,198,119,.16);border:1px solid rgba(227,198,119,.4);display:flex;align-items:center;justify-content:center;color:#E3C677;font-size:22px;\">▶<\u002Fdiv>\n          <div style=\"font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:1.5px;text-transform:uppercase;color:#c8b98e;margin-top:16px;\">Video coming soon<\u002Fdiv>\n          <div style=\"font-size:14px;color:#8f8675;margin-top:4px;\">Filming Friday<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- 2 · THE STAKES -->\n  <section style=\"background:#f4eee0;border-top:1px solid #ece3d0;border-bottom:1px solid #ece3d0;\">\n    <div class=\"dz-wrap\" style=\"max-width:1180px;margin:0 auto;padding:76px 40px;\">\n      <div style=\"max-width:760px;\">\n        <span style=\"font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:1.5px;text-transform:uppercase;color:#9a7d2e;\">// Why the price is everything<\u002Fspan>\n        <h2 class=\"dz-h2\" style=\"font-family:'Cormorant Garamond',serif;font-weight:600;font-size:42px;line-height:1.1;color:#1a1814;margin-top:16px;\">You've owned this home for 20, 30 years. You only get to sell it once.<\u002Fh2>\n      <\u002Fdiv>\n      <div class=\"dz-split\" style=\"display:grid;grid-template-columns:repeat(3,1fr);gap:24px;margin-top:44px;\">\n        <div style=\"background:#fff;border:1px solid #ece3d0;border-radius:12px;padding:30px 26px;\">\n          <div style=\"font-family:'Cormorant Garamond',serif;font-size:34px;font-weight:600;color:#9a7d2e;line-height:1;\">Too low<\u002Fdiv>\n          <p style=\"font-size:17px;line-height:1.6;color:#544f44;margin-top:12px;\">You hand away money you'll never get back, on the one asset that's supposed to fund the next chapter.<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"background:#fff;border:1px solid #ece3d0;border-radius:12px;padding:30px 26px;\">\n          <div style=\"font-family:'Cormorant Garamond',serif;font-size:34px;font-weight:600;color:#9a7d2e;line-height:1;\">Too high<\u002Fdiv>\n          <p style=\"font-size:17px;line-height:1.6;color:#544f44;margin-top:12px;\">It sits, goes stale, and quietly sells for less than it would have if it had been priced right on day one.<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"background:#1a1814;border:1px solid #1a1814;border-radius:12px;padding:30px 26px;\">\n          <div style=\"font-family:'Cormorant Garamond',serif;font-size:34px;font-weight:600;color:#E3C677;line-height:1;\">Just right<\u002Fdiv>\n          <p style=\"font-size:17px;line-height:1.6;color:#c4bba9;margin-top:12px;\">One number, measured not guessed, that decides how comfortably the next chapter starts.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- 3 · PROOF — the signature gap -->\n  <section class=\"dz-wrap\" style=\"max-width:1180px;margin:0 auto;padding:88px 40px;\">\n    <div style=\"text-align:center;max-width:680px;margin:0 auto 52px;\">\n      <span style=\"font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:1.5px;text-transform:uppercase;color:#9a7d2e;\">// What the algorithm couldn't see<\u002Fspan>\n      <h2 class=\"dz-h2\" style=\"font-family:'Cormorant Garamond',serif;font-weight:600;font-size:42px;line-height:1.1;color:#1a1814;margin-top:16px;\">The estimate said one number. The house sold for {{ soldFmt }}.<\u002Fh2>\n    <\u002Fdiv>\n\n    <div class=\"dz-gap\" style=\"display:grid;grid-template-columns:1fr auto 1fr;gap:30px;align-items:center;max-width:960px;margin:0 auto;\">\n      <!-- estimate -->\n      <div style=\"background:#fff;border:1px solid #ece3d0;border-radius:16px;padding:38px 32px;text-align:center;\">\n        <div style=\"font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:1.5px;text-transform:uppercase;color:#9a8a55;\">The algorithm's estimate<\u002Fdiv>\n        <div class=\"dz-bignum\" style=\"font-family:'Cormorant Garamond',serif;font-size:64px;font-weight:700;color:#8a8474;line-height:1;margin-top:14px;letter-spacing:-1px;\">{{ estimateFmt }}<\u002Fdiv>\n        <div style=\"font-size:14px;color:#8f8675;margin-top:12px;\">A guess from public records and comps it can't actually walk through.<\u002Fdiv>\n      <\u002Fdiv>\n      <!-- arrow -->\n      <div class=\"dz-gap-arrow\" style=\"font-family:'IBM Plex Mono',monospace;font-size:26px;color:#C8A24A;\">→<\u002Fdiv>\n      <!-- actual -->\n      <div style=\"background:#1a1814;border-radius:16px;padding:38px 32px;text-align:center;box-shadow:0 24px 50px -20px rgba(60,48,20,.4);\">\n        <div style=\"font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:1.5px;text-transform:uppercase;color:#c8b98e;\">What it actually sold for<\u002Fdiv>\n        <div class=\"dz-bignum\" style=\"font-family:'Cormorant Garamond',serif;font-size:64px;font-weight:700;color:#E3C677;line-height:1;margin-top:14px;letter-spacing:-1px;\">{{ soldFmt }}<\u002Fdiv>\n        <div style=\"font-size:14px;color:#c4bba9;margin-top:12px;\">Priced by an appraiser who saw the condition, the upgrades, and the street.<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <!-- the gap, called out large -->\n    <div style=\"text-align:center;margin-top:44px;\">\n      <div style=\"font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:2px;text-transform:uppercase;color:#9a7d2e;\">The gap the algorithm left on the table<\u002Fdiv>\n      <div class=\"dz-gapnum\" style=\"font-family:'Cormorant Garamond',serif;font-size:96px;font-weight:700;color:#1a1814;line-height:1;letter-spacing:-2px;margin-top:8px;\">{{ gapFmt }}<\u002Fdiv>\n      <p style=\"font-size:18px;line-height:1.6;color:#544f44;max-width:600px;margin:18px auto 0;\">That gap is what an appraiser sees that the algorithm can't: condition, upgrades, and what's actually happening two streets over. <em style=\"font-style:italic;color:#1a1814;\">(A real Utah County sale. Details swapped in before launch.)<\u002Fem><\u002Fp>\n    <\u002Fdiv>\n\n    <!-- optional example-sale video placeholder -->\n    <div data-video-slot=\"example\" style=\"position:relative;aspect-ratio:16/9;max-width:760px;margin:52px auto 0;background:#1a1814;border-radius:14px;overflow:hidden;border:1px solid #2a2620;display:flex;flex-direction:column;align-items:center;justify-content:center;\">\n      <div style=\"width:60px;height:60px;border-radius:50%;background:rgba(227,198,119,.16);border:1px solid rgba(227,198,119,.4);display:flex;align-items:center;justify-content:center;color:#E3C677;font-size:20px;\">▶<\u002Fdiv>\n      <div style=\"font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:1.5px;text-transform:uppercase;color:#c8b98e;margin-top:14px;\">The full breakdown, on video<\u002Fdiv>\n      <div style=\"font-size:14px;color:#8f8675;margin-top:4px;\">Coming soon<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- 4 · ⭐ HERO OFFER — free 30-minute appraiser's look -->\n  <section id=\"look\" style=\"background:#1a1814;color:#faf7f1;\">\n    <div class=\"dz-wrap\" style=\"max-width:1180px;margin:0 auto;padding:88px 40px;\">\n      <div class=\"dz-split\" style=\"display:grid;grid-template-columns:1.05fr 0.95fr;gap:56px;align-items:center;\">\n        <div>\n          <span style=\"display:inline-block;font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:1.5px;text-transform:uppercase;color:#1a1814;background:#E3C677;padding:6px 12px;border-radius:6px;\">★ The free 30-minute look<\u002Fspan>\n          <h2 class=\"dz-h2\" style=\"font-family:'Cormorant Garamond',serif;font-weight:600;font-size:46px;line-height:1.06;margin-top:20px;\">A licensed appraiser's honest read on your home. No obligation.<\u002Fh2>\n          <p style=\"font-size:20px;line-height:1.65;color:#e7dfcd;margin-top:22px;font-style:italic;font-family:'Cormorant Garamond',serif;\">\"If you want something more in-depth and custom, I'm happy to take a quick look. It'll take me no more than half an hour, and I'll give you my honest read, no obligation. All I ask is that when you're ready to think about selling seriously, you give me a thought.\"<\u002Fp>\n          <div style=\"font-family:'IBM Plex Mono',monospace;font-size:13px;letter-spacing:1px;color:#c8b98e;margin-top:18px;\">— Andrew, The Appraisal Professor<\u002Fdiv>\n        <\u002Fdiv>\n        <form data-form=\"look\" style=\"background:#231f1a;border:1px solid #38322a;border-radius:14px;padding:34px;\">\n          <div style=\"font-family:'Cormorant Garamond',serif;font-size:24px;font-weight:600;color:#faf7f1;margin-bottom:20px;\">Get my free appraiser's look<\u002Fdiv>\n          <div style=\"margin-bottom:16px;\"><label style=\"display:block;font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:1px;text-transform:uppercase;color:#8f8675;margin-bottom:8px;\">Name<\u002Flabel><input name=\"name\" required=\"\" class=\"dz-focus\" style=\"width:100%;background:#1a1814;border:1px solid #4a4338;border-radius:8px;padding:15px 16px;color:#faf7f1;font-size:17px;font-family:'Hanken Grotesk',sans-serif;outline:none;\"><\u002Fdiv>\n          <div style=\"margin-bottom:16px;\"><label style=\"display:block;font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:1px;text-transform:uppercase;color:#8f8675;margin-bottom:8px;\">Email<\u002Flabel><input type=\"email\" name=\"email\" required=\"\" class=\"dz-focus\" style=\"width:100%;background:#1a1814;border:1px solid #4a4338;border-radius:8px;padding:15px 16px;color:#faf7f1;font-size:17px;font-family:'Hanken Grotesk',sans-serif;outline:none;\"><\u002Fdiv>\n          <div style=\"margin-bottom:16px;\"><label style=\"display:block;font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:1px;text-transform:uppercase;color:#8f8675;margin-bottom:8px;\">Phone<\u002Flabel><input type=\"tel\" name=\"phone\" required=\"\" class=\"dz-focus\" style=\"width:100%;background:#1a1814;border:1px solid #4a4338;border-radius:8px;padding:15px 16px;color:#faf7f1;font-size:17px;font-family:'Hanken Grotesk',sans-serif;outline:none;\"><\u002Fdiv>\n          <div style=\"margin-bottom:22px;\"><label style=\"display:block;font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:1px;text-transform:uppercase;color:#8f8675;margin-bottom:8px;\">Property address<\u002Flabel><input name=\"address\" required=\"\" class=\"dz-focus\" style=\"width:100%;background:#1a1814;border:1px solid #4a4338;border-radius:8px;padding:15px 16px;color:#faf7f1;font-size:17px;font-family:'Hanken Grotesk',sans-serif;outline:none;\"><\u002Fdiv>\n          <button type=\"submit\" class=\"dz-focus\" style=\"width:100%;background:#E3C677;color:#1a1814;border:none;border-radius:8px;padding:17px;font-size:17px;font-weight:700;font-family:'Hanken Grotesk',sans-serif;cursor:pointer;\">Get my free appraiser's look<\u002Fbutton>\n          <p data-form-note=\"look\" style=\"font-size:13px;color:#8f8675;margin-top:14px;line-height:1.5;text-align:center;\">Andrew reviews every request personally. No obligation, ever.<\u002Fp>\n        <\u002Fform>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- 5 · GUIDE — soft landing (deliberately quieter) -->\n  <section class=\"dz-wrap\" style=\"max-width:1180px;margin:0 auto;padding:64px 40px;\">\n    <div class=\"dz-split\" style=\"display:grid;grid-template-columns:1.3fr 0.7fr;gap:40px;align-items:center;background:#f4eee0;border:1px solid #ece3d0;border-radius:14px;padding:40px;\">\n      <div>\n        <span style=\"font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:1.5px;text-transform:uppercase;color:#9a7d2e;\">// Not ready for all that? Start small.<\u002Fspan>\n        <h3 style=\"font-family:'Cormorant Garamond',serif;font-weight:600;font-size:30px;line-height:1.15;color:#1a1814;margin-top:12px;\">Worth It / Skip It: An Appraiser's Guide to What Actually Adds Value Before You Sell<\u002Fh3>\n        <p style=\"font-size:17px;line-height:1.6;color:#544f44;margin-top:12px;max-width:560px;\">The tips and fixes that put real money back in your pocket, and the ones that waste your time and cash. Straight from the appraiser.<\u002Fp>\n      <\u002Fdiv>\n      <form data-form=\"guide\" style=\"display:flex;flex-direction:column;gap:12px;\">\n        <input name=\"name\" placeholder=\"Name\" required=\"\" class=\"dz-focus\" style=\"width:100%;background:#fff;border:1px solid #e8ddc6;border-radius:8px;padding:14px 16px;font-size:16px;font-family:'Hanken Grotesk',sans-serif;outline:none;\">\n        <input type=\"email\" name=\"email\" placeholder=\"Email\" required=\"\" class=\"dz-focus\" style=\"width:100%;background:#fff;border:1px solid #e8ddc6;border-radius:8px;padding:14px 16px;font-size:16px;font-family:'Hanken Grotesk',sans-serif;outline:none;\">\n        <button type=\"submit\" class=\"dz-focus\" style=\"width:100%;background:#1a1814;color:#faf7f1;border:none;border-radius:8px;padding:15px;font-size:16px;font-weight:700;font-family:'Hanken Grotesk',sans-serif;cursor:pointer;\">Email me the guide<\u002Fbutton>\n        <p data-form-note=\"guide\" style=\"font-size:12.5px;color:#8f8675;text-align:center;line-height:1.5;\">A PDF, plus the occasional note from Andrew. Unsubscribe anytime.<\u002Fp>\n      <\u002Fform>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- 6 · ABOUT ANDREW -->\n  <section style=\"background:#f4eee0;border-top:1px solid #ece3d0;border-bottom:1px solid #ece3d0;\">\n    <div class=\"dz-wrap\" style=\"max-width:1180px;margin:0 auto;padding:80px 40px;\">\n      <div class=\"dz-split\" style=\"display:grid;grid-template-columns:0.8fr 1.2fr;gap:52px;align-items:center;\">\n        <image-slot id=\"dz-andrew\" src=\"4117b02a-ae69-4f3a-bb00-f9fd2e598cc4\" style=\"display:block;width:100%;height:420px;border-radius:14px;border:1px solid #e8ddc6;\" shape=\"rounded\" radius=\"14\" placeholder=\"Andrew's photo\"><\u002Fimage-slot>\n        <div>\n          <span style=\"font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:1.5px;text-transform:uppercase;color:#9a7d2e;\">// About Andrew<\u002Fspan>\n          <h2 class=\"dz-h2\" style=\"font-family:'Cormorant Garamond',serif;font-weight:600;font-size:42px;line-height:1.08;color:#1a1814;margin-top:14px;\">A price, or a guess with a sign in the yard?<\u002Fh2>\n          <p style=\"font-size:18px;line-height:1.7;color:#544f44;margin-top:18px;\">Andrew is a licensed appraiser and a licensed agent with 23 years in Utah County. Most agents guess at value and hope. Andrew measures it, then sells it.<\u002Fp>\n          <p style=\"font-size:18px;line-height:1.7;color:#544f44;margin-top:14px;\">That dual credential is the whole reason any of this holds up: the number you get isn't a pitch to win your listing, it's a defensible valuation that survives the bank's appraisal and closing.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- 7 · READY TO TALK — express lane -->\n  <section class=\"dz-wrap\" style=\"max-width:1180px;margin:0 auto;padding:76px 40px;text-align:center;\">\n    <span style=\"font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:1.5px;text-transform:uppercase;color:#9a7d2e;\">// The express lane<\u002Fspan>\n    <h2 class=\"dz-h2\" style=\"font-family:'Cormorant Garamond',serif;font-weight:600;font-size:42px;line-height:1.08;color:#1a1814;margin-top:14px;max-width:640px;margin-left:auto;margin-right:auto;\">Already know it's time? Let's skip the guide and just talk.<\u002Fh2>\n    <div style=\"margin-top:30px;\">\n      <a href=\"#look\" class=\"dz-focus\" style=\"display:inline-flex;align-items:center;gap:10px;background:#1a1814;color:#faf7f1;font-size:17px;font-weight:600;padding:17px 34px;border-radius:8px;text-decoration:none;\">Talk to Andrew →<\u002Fa>\n    <\u002Fdiv>\n    <p style=\"font-size:15px;color:#6a6253;margin-top:16px;\">Prefer to call or text? <a href=\"#look\" style=\"font-weight:600;\">Reach Andrew directly.<\u002Fa><\u002Fp>\n  <\u002Fsection>\n\n  <!-- 8 · FOOTER (matches main site) -->\n  <footer style=\"background:#1a1814;color:#c4bba9;\">\n    <div class=\"dz-wrap\" style=\"max-width:1180px;margin:0 auto;padding:44px 40px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:20px;\">\n      <div style=\"display:flex;align-items:center;gap:12px;\">\n        <span style=\"width:32px;height:32px;border-radius:8px;background:#C8A24A;display:flex;align-items:center;justify-content:center;color:#1a1814;font-family:'Cormorant Garamond',serif;font-weight:700;font-size:15px;\">AP<\u002Fspan>\n        <span style=\"font-size:14px;\">The Appraisal Professor · Licensed Appraiser &amp; Agent, Utah County<\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"display:flex;align-items:center;gap:24px;\">\n        <a href=\"https://www.youtube.com/@TheAppraisalProfessor\" style=\"color:#E3C677;font-size:14px;font-weight:600;text-decoration:none;\">YouTube<\u002Fa>\n        <a href=\"https://www.instagram.com/TheAppraisalProfessor\" style=\"color:#E3C677;font-size:14px;font-weight:600;text-decoration:none;\">Instagram<\u002Fa>\n        <span style=\"font-family:'IBM Plex Mono',monospace;font-size:11.5px;letter-spacing:.5px;color:#8f8675;\">© 2026<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Ffooter>\n\n<\u002Fdiv>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:&quot;100%&quot;},&quot;estimateValue&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:421000,&quot;tsType&quot;:&quot;number&quot;,&quot;unit&quot;:&quot;$&quot;,&quot;section&quot;:&quot;Proof numbers&quot;},&quot;soldValue&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:455000,&quot;tsType&quot;:&quot;number&quot;,&quot;unit&quot;:&quot;$&quot;,&quot;section&quot;:&quot;Proof numbers&quot;}}\">\nclass Component extends DCLogic {\n  componentDidMount() {\n    // Front-end confirmation only. To receive submissions, add\n    // netlify data-attributes / action to each <form> and remove this.\n    this._root = document.currentScript ? null : document;\n    setTimeout(() => {\n      document.querySelectorAll('form[data-form]').forEach((form) => {\n        form.addEventListener('submit', (e) => {\n          e.preventDefault();\n          const kind = form.getAttribute('data-form');\n          const btn = form.querySelector('button[type=\"submit\"]');\n          const note = form.querySelector('[data-form-note]');\n          if (btn) { btn.disabled = true; btn.style.opacity = '.85'; btn.textContent = kind === 'guide' ? 'Sent — check your inbox ✓' : \"Sent ✓\"; }\n          if (note) note.textContent = kind === 'guide' ? 'The guide is on its way to your inbox.' : 'Andrew will be in touch within one business day.';\n        });\n      });\n    }, 60);\n  }\n  fmt(n) {\n    const v = Math.round(Number(n) || 0);\n    return '$' + v.toLocaleString('en-US');\n  }\n  renderVals() {\n    const estimate = this.props.estimateValue ?? 421000;\n    const sold = this.props.soldValue ?? 455000;\n    const gap = Math.max(0, sold - estimate);\n    return {\n      estimateFmt: this.fmt(estimate),\n      soldFmt: this.fmt(sold),\n      gapFmt: '+' + this.fmt(gap),\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
